# SRS in edge mode = the public RTMP front door (the only forwarded port). No secrets here: the relay's hooks decide who
# may publish (APP_IN with ?token=) and play (APP_OUT). Names resolve through the compose network when used.
listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;
srs_log_level_v2    warn;              # not info: it would print every publisher's URL incl. ?token=
http_api   { enabled off; }
http_server { enabled off; }
srt_server { enabled off; }
rtc_server { enabled off; }
vhost __defaultVhost__ {
    cluster {
        mode    remote;                 # forward publishes to, pull plays from, the origin
        origin  srs:1935;
    }
    http_hooks {
        enabled     on;
        on_publish  http://delay-relay:9090/srs/edge_on_publish;
        on_play     http://delay-relay:9090/srs/edge_on_play;
    }
    tcp_nodelay     on;
    min_latency     on;
    play    { mw_latency 1; mw_msgs 1; gop_cache on; }
    publish { mr off; normal_timeout 5000; firstpkt_timeout 5000; }   # a dead publisher frees its key after 5 s
}
